# Ryoku palette for yazi. Rendered by the theme daemon; do not edit.
#
# yazi reads theme.toml beside yazi.toml. Ryoku ships only yazi.toml, so this
# file is the daemon's alone and clobbers nothing you wrote.

[mgr]
cwd = { fg = "#dcc3a1" }

hovered = { fg = "#ffddb0", bg = "#614000" }
preview_hovered = { underline = true }

find_keyword = { fg = "#b6cea3", bold = true }
find_position = { fg = "#dcc3a1", bold = true }

marker_copied = { fg = "#b6cea3", bg = "#b6cea3" }
marker_cut = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_marked = { fg = "#dcc3a1", bg = "#dcc3a1" }
marker_selected = { fg = "#f2be6e", bg = "#f2be6e" }

tab_active = { fg = "#442c00", bg = "#f2be6e" }
tab_inactive = { fg = "#d2c4b4", bg = "#241f17" }

border_symbol = "│"
border_style = { fg = "#4f4539" }

[mode]
normal_main = { fg = "#442c00", bg = "#f2be6e", bold = true }
normal_alt = { fg = "#f2be6e", bg = "#241f17" }
select_main = { fg = "#233517", bg = "#b6cea3", bold = true }
select_alt = { fg = "#b6cea3", bg = "#241f17" }
unset_main = { fg = "#690005", bg = "#ffb4ab", bold = true }
unset_alt = { fg = "#ffb4ab", bg = "#241f17" }

[status]
progress_label = { fg = "#ede1d4", bold = true }
progress_normal = { fg = "#f2be6e", bg = "#241f17" }
progress_error = { fg = "#ffb4ab", bg = "#241f17" }

[input]
border = { fg = "#f2be6e" }
title = {}
value = {}
selected = { reversed = true }

[pick]
border = { fg = "#f2be6e" }
active = { fg = "#b6cea3", bold = true }
inactive = {}

[cmp]
border = { fg = "#f2be6e" }
active = { fg = "#b6cea3", bold = true }
inactive = {}

[tasks]
border = { fg = "#f2be6e" }
title = {}
hovered = { fg = "#b6cea3", underline = true }

[which]
mask = { bg = "#241f17" }
cand = { fg = "#dcc3a1" }
rest = { fg = "#d2c4b4" }
desc = { fg = "#b6cea3" }
separator = "  "
separator_style = { fg = "#9b8f80" }

[help]
on = { fg = "#dcc3a1" }
run = { fg = "#b6cea3" }
hovered = { reversed = true, bold = true }
footer = { fg = "#ede1d4", bg = "#241f17" }

[notify]
title_info = { fg = "#f2be6e" }
title_warn = { fg = "#b6cea3" }
title_error = { fg = "#ffb4ab" }

# the file list itself: dirs and file kinds carry the palette so yazi matches
# kitty's ANSI colours (base16), not yazi's built-in defaults. First match wins,
# so the "*" fallback stays last.
[filetype]
rules = [
	{ mime = "image/*", fg = "#b6cea3" },
	{ mime = "{audio,video}/*", fg = "#f2be6e" },
	{ mime = "application/{zip,gzip,x-tar,x-bzip2,x-7z-compressed,x-rar,vnd.rar,x-xz,zstd}", fg = "#f2be6e" },
	{ url = "*", is = "orphan", fg = "#ffb4ab" },
	{ url = "*", is = "exec", fg = "#b6cea3" },
	{ url = "*/", fg = "#dcc3a1", bold = true },
	{ url = "*", fg = "#ede1d4" },
]
