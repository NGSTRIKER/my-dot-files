# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#120d07"
set -gq @thm_bar_bg                       "#120d07"

set -gq @thm_bg                           "#18130b"
set -gq @thm_fg                           "#ede1d4"
set -gq @thm_primary                      "#f2be6e"
set -gq @thm_inverse_primary              "#7e570f"
